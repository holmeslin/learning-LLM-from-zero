[project]
name = "learning-llm-from-zero"
version = "0.1.0"
description = "《從零開始學 LLM》的程式碼：llmz 套件與測試"
readme = "README.md"
authors = [{ name = "Holmes Lin" }]
requires-python = ">=3.13"
# 刻意鎖版本；升級前先確認全書範例都通過。
dependencies = [
    "torch==2.9.*",
    "numpy>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llmz"

# Linux（CI）用 CPU 版 torch，不下載 CUDA；macOS 的 PyPI 版本已經含 MPS。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
